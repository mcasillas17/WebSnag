name: Release debug APK

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Check out the tagged commit and create its GitHub prerelease.

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: "14742923"
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Test, lint, and build debug APK
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: >-
          ./gradlew testDebugUnitTest lintDebug assembleDebug
          -PwebsnagReleaseTag="$TAG_NAME"
          --continue --stacktrace --no-daemon

      - name: Verify release metadata
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          metadata_file="$RUNNER_TEMP/websnag-version.properties"
          ./gradlew -q :app:printWebSnagVersion \
            -PwebsnagReleaseTag="$TAG_NAME" \
            --no-daemon --no-configuration-cache > "$metadata_file"

          expected_name="$(sed -n 's/^versionName=//p' "$metadata_file")"
          expected_code="$(sed -n 's/^versionCode=//p' "$metadata_file")"
          if [[ -z "$expected_name" || ! "$expected_code" =~ ^[0-9]+$ ]]; then
            echo "Gradle returned invalid release metadata" >&2
            exit 1
          fi

          source_apk="app/build/outputs/apk/debug/app-debug.apk"
          actual_name="$(apkanalyzer manifest version-name "$source_apk")"
          actual_code="$(apkanalyzer manifest version-code "$source_apk")"
          if [[ "$actual_name" != "$expected_name" || "$actual_code" != "$expected_code" ]]; then
            echo "APK manifest version does not match the release tag" >&2
            exit 1
          fi

          printf 'VERSION_NAME=%s\n' "$actual_name" >> "$GITHUB_ENV"
          printf 'VERSION_CODE=%s\n' "$actual_code" >> "$GITHUB_ENV"

      - name: Stage release asset
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if (( ${#TAG_NAME} > 64 )) || [[ ! "$TAG_NAME" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Unsupported release tag" >&2
            exit 1
          fi

          source_apk="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "$source_apk" ]]; then
            echo "Expected debug APK was not produced" >&2
            exit 1
          fi

          asset_path="websnag-${TAG_NAME}-debug.apk"
          cp "$source_apk" "$asset_path"
          printf 'ASSET_PATH=%s\n' "$asset_path" >> "$GITHUB_ENV"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<'EOF'
          > [!WARNING]
          > This is an early debug build. Uninstall any previous CI-distributed
          > WebSnag build before installing this APK. Uninstalling removes the
          > app's local data.
          EOF
          printf '\n- Version name: `%s`\n- Version code: `%s`\n' \
            "$VERSION_NAME" "$VERSION_CODE" >> "$notes_file"

          gh release create "$TAG_NAME" \
            "$ASSET_PATH#WebSnag ${TAG_NAME} debug APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "WebSnag ${TAG_NAME}" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --notes-file "$notes_file"
