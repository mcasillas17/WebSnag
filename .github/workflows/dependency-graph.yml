name: Dependency Graph

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-graph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate-for-pull-request:
    name: Generate pull request snapshot
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: "14742923"
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Verify build dependency security
        run: ./gradlew verifyBuildDependencySecurity --no-daemon --no-configuration-cache

      - name: Generate dependency graph artifact
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          additional-arguments: --no-configuration-cache
          artifact-retention-days: 1
          cache-provider: basic
          dependency-graph: generate-and-upload
          validate-wrappers: true

  submit-for-main:
    name: Submit main snapshot
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Submit the trusted main-branch snapshot to the dependency graph API.

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: "14742923"
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Verify build dependency security
        run: ./gradlew verifyBuildDependencySecurity --no-daemon --no-configuration-cache

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          additional-arguments: --no-configuration-cache
          cache-provider: basic
          dependency-graph: generate-and-submit
          validate-wrappers: true
