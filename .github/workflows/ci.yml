name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Device instrumentation coverage
        type: choice
        options: [smoke, full]
        default: smoke

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: "14742923"
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Test release version build logic
        run: ./gradlew -p buildSrc test --no-daemon --no-configuration-cache

      - name: Test release trust and temporary-key lifecycle without credentials
        run: python3 -B -m unittest discover -s scripts/release -p 'test_*.py' -v

      - name: Test device harness failure gates
        run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py' -v

      - name: Verify build dependency security
        run: ./gradlew verifyBuildDependencySecurity --no-daemon --no-configuration-cache

      - name: Test, lint, and build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --continue --no-daemon

      - name: Upload failure reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-reports-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  device-safety:
    name: Device safety
    uses: ./.github/workflows/device-tests.yml
    with:
      suite: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'smoke' }}
