name: Build signed release candidates

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version input only, e.g. v1.0.0-alpha.5; does not create a tag or release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: protected-prerelease-signing
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate trusted release input
    if: >-
      github.repository == 'mcasillas17/WebSnag' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out immutable main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK 35
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: "14742923"
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Validate commit, tag input and recorded certificate
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 -B scripts/release/release_build.py preflight
      - name: Test build logic and verify dependency floors
        run: |
          ./gradlew -p buildSrc test --rerun-tasks --no-daemon --no-configuration-cache --no-build-cache
          ./gradlew verifyBuildDependencySecurity --no-daemon --no-configuration-cache --no-build-cache

  sign:
    name: Protected APK and AAB build
    needs: preflight
    environment: prerelease-signing
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out immutable main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK 35
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: "14742923"
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Recheck trust before making credentials available
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 -B scripts/release/release_build.py preflight
      - name: Build and check signed candidates
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 -B scripts/release/release_build.py build
      - name: Remove private runner state even after cancellation
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNNER_TEMP"
          rm -rf -- "$RUNNER_TEMP/websnag-release"
          test ! -e "$RUNNER_TEMP/websnag-release"
